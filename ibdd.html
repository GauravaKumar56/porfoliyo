<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Protected Website</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
        }

        /* Password Screen */
        #passwordScreen {
            position: fixed;
            inset: 0;
            background: #08111f;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 99999;
        }

        .password-box {
            width: 350px;
            padding: 30px;
            background: #111d2e;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.5);
        }

        .password-box h2 {
            color: white;
            margin-bottom: 20px;
        }

        .password-box input {
            width: 100%;
            padding: 12px;
            border: none;
            outline: none;
            border-radius: 8px;
            margin-bottom: 12px;
        }

        .password-box button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background: #00aaff;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        .password-box button:hover {
            background: #0088cc;
        }

        #error {
            color: #ff4d4d;
            margin-top: 10px;
            display: none;
        }

        /* Website */
        #website {
            display: none;
        }
    </style>
</head>

<body>

    <!-- Password Screen -->
    <div id="passwordScreen">
        <div class="password-box">
            <h2>🔒 Enter Password</h2>

            <input 
                type="password" 
                id="password"
                placeholder="Enter password"
            >

            <button onclick="checkPassword()">
                Login
            </button>

            <p id="error">❌ Wrong Password!</p>
        </div>
    </div>


    <!-- Your Website -->
    <div id="website">

        <h1>Welcome To My Website 🚀</h1>

        <p>
            Ye tumhari actual website ka content hai.
        </p>

    </div>


    <script>

        function checkPassword() {

            const password = document.getElementById("password").value;

            // Apna password yahan likho
            const correctPassword = "12345";

            if (password == correctPassword) {

                document.getElementById("passwordScreen").style.display = "none";
                document.getElementById("website").style.display = "block";

            } else {

                document.getElementById("error").style.display = "block";

            }
        }

    </script>

</body>
</html>
